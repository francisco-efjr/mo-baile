version: 2
updates:
  # Ações dos workflows. Estão fixadas por SHA; o Dependabot atualiza o SHA e o
  # comentário com a tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      acoes:
        patterns: ["*"]

  # Dependências do motor (engine/pyproject.toml).
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
