name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Menor privilegio: nenhum job escreve no repositorio. Quem precisar de mais
# declara no proprio job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Acoes de terceiros fixadas por SHA de commit (tag no comentario): tag move,
# SHA nao. O Dependabot (.github/dependabot.yml) propoe as atualizacoes.
# persist-credentials: false porque nenhum passo precisa do token depois do
# checkout.
jobs:
  versao:
    name: Versão (docs/VERSIONAMENTO.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cópias e CHANGELOG batem com VERSION
        run: python tools/version.py check
      # Todo PR sobe a versão: é a mesma regra do hook de pre-push, para quem
      # empurrou com --no-verify ou sem `make hooks`.
      - name: Versão maior que a da branch de destino
        if: github.event_name == 'pull_request'
        # Contexto do evento entra por variavel de ambiente, nunca interpolado
        # direto no script.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git show "origin/${BASE_REF}:VERSION" 2>/dev/null || echo 0.0.0)"
          head="$(cat VERSION)"
          python - "$base" "$head" <<'PY'
          import sys
          base, head = (tuple(map(int, v.strip().split("."))) for v in sys.argv[1:])
          if head <= base:
              print(f"::error::VERSION {sys.argv[2]} nao e maior que {sys.argv[1]} da branch de destino. Rode tools/version.py bump.")
              sys.exit(1)
          PY

  engine:
    name: Motor (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar o motor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev]"

      # O motor roda sem servidor gráfico e sem aparelho de propósito. Foi o
      # que permitiu tirar a suite do estado em que ela sequer era coletada.
      - name: Testes
        run: |
          cd engine
          python -m pytest --cov --cov-report=term-missing
          cd ..
          python -m pytest qa/tests -q

      - name: Fluxos de ponta a ponta com dispositivos falsos
        run: python qa/run_all.py

      - name: Lint
        run: python -m ruff check engine apps tools qa

      - name: Padrões inseguros (bandit)
        run: python -m bandit -q -r engine/src -ll

      - name: Vulnerabilidades conhecidas nas dependências
        run: python -m pip_audit --skip-editable
        continue-on-error: true

  contrato:
    name: Contrato Python/Swift em dia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e "engine[dev]"

      # As fixtures consumidas pela suite Swift são geradas pelo motor. Se
      # alguém mudar um campo do contrato e esquecer de regerar, o front quebra
      # em execução; aqui quebra no PR.
      - name: Regerar fixtures e conferir se houve mudança
        run: |
          python tools/generate_fixtures.py
          if ! git diff --quiet -- apps/MoBaile/Tests/MoBaileTests/Fixtures; then
            echo "::error::As fixtures do contrato estão desatualizadas. Rode 'make fixtures' e faça o commit."
            git diff -- apps/MoBaile/Tests/MoBaileTests/Fixtures
            exit 1
          fi

  front:
    name: Front nativo (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Versão do Swift
        run: swift --version
      - name: Build
        run: cd apps/MoBaile && swift build
      - name: Testes
        run: cd apps/MoBaile && swift test
