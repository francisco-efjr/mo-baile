<!-- @dsCard group="Motion" viewport="700x200" name="Molas" subtitle="smooth (padrão) · snappy (cliques) · bouncy (manipulação direta) — passe o mouse" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Molas</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.p{padding:16px;background:var(--bg-content);color:var(--label-primary)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:14px}.sw i{display:block;height:44px;border-radius:8px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}.sw b{font-weight:600}.sw code,code{font-family:var(--font-mono);font-size:10px;color:var(--label-secondary)}.two{display:grid;grid-template-columns:1fr 1fr}.tr{height:28px;border-radius:999px;background:var(--fill-secondary);position:relative}.tr i{position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:var(--accent)}.p:hover .tr i{left:calc(100% - 26px)}</style></head><body class="mb-root"><div class="p" style="display:grid;grid-template-columns:110px 1fr 200px;gap:10px 14px;align-items:center"><b style="font-weight:600">smooth</b><div class="tr"><i style="transition:left var(--spring-smooth-duration) var(--spring-smooth-ease)"></i></div><code>0,5 s · bounce 0 · var(--spring-smooth-ease)</code><b style="font-weight:600">snappy</b><div class="tr"><i style="transition:left var(--spring-snappy-duration) var(--spring-snappy-ease)"></i></div><code>0,35 s · bounce 0,15 · var(--spring-snappy-ease)</code><b style="font-weight:600">bouncy</b><div class="tr"><i style="transition:left var(--spring-bouncy-duration) var(--spring-bouncy-ease)"></i></div><code>0,5 s · bounce 0,3 · var(--spring-bouncy-ease)</code><b style="font-weight:600">smooth-small</b><div class="tr"><i style="transition:left var(--spring-smooth-small-duration) var(--spring-smooth-small-ease)"></i></div><code>0,3 s · bounce 0 · var(--spring-smooth-small-ease)</code></div></body></html>
