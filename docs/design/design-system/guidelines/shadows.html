<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Profundidade</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.p{padding:16px;background:var(--bg-content);color:var(--label-primary)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:14px}.sw i{display:block;height:44px;border-radius:8px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}.sw b{font-weight:600}.sw code,code{font-family:var(--font-mono);font-size:10px;color:var(--label-secondary)}.two{display:grid;grid-template-columns:1fr 1fr}</style></head><body class="mb-root"><div class="p" style="display:flex;gap:28px;align-items:center;background:var(--bg-desktop);padding:28px"><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:90px;height:64px;border-radius:12px;background:var(--bg-content);box-shadow:var(--shadow-window-active)"></div><code>janela ativa</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:90px;height:64px;border-radius:12px;background:var(--bg-content);box-shadow:var(--shadow-window-inactive)"></div><code>janela inativa</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:90px;height:64px;border-radius:12px;background:var(--bg-content);box-shadow:var(--shadow-sheet)"></div><code>sheet</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:90px;height:64px;border-radius:12px;background:var(--bg-content);box-shadow:var(--shadow-menu)"></div><code>menu</code></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:90px;height:64px;border-radius:12px;background:var(--bg-content);box-shadow:var(--shadow-control)"></div><code>controle</code></div></div></body></html>
