<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Papéis do vidro</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.two{display:grid;grid-template-columns:1fr 1fr}.p{padding:16px;background:var(--bg-content);color:var(--label-primary);display:flex;flex-direction:column;gap:10px;font-size:12px}code{font-family:var(--font-mono);font-size:10px;color:var(--label-secondary)}.palco{position:relative;height:96px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px}.liso{background:var(--bg-content);box-shadow:inset 0 0 0 .5px var(--separator)}.ceu{background:url(../assets/splash_bg.png) center/cover}.cap{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;font-family:var(--font-mono);font-size:11px}.cap i{width:7px;height:7px;border-radius:50%;background:var(--warning-fill,#F5C451)}.painel{padding:10px 14px}.trilho{width:160px;height:6px;border-radius:999px;overflow:hidden}.trilho b{display:block;width:70%;height:100%;background:var(--accent)}</style></head><body class="mb-root"><div class="two">
<div class="p"><code>flutuante · capsula · Rodar — sobre conteúdo</code>
<div class="palco liso"><span class="mb-glass mb-glass--capsula cap"><i></i>Ambiente: 3 de 4 →</span><div class="mb-tb-group mb-tb-group--tinted"><span class="mb-tb-item mb-tb-item--tinted">▶︎ Rodar</span></div></div>
<div class="palco liso"><div class="mb-glass mb-glass--flutuante painel">⌘ Buscar ação…</div></div>
<code>midia — sobre imagem</code>

<div class="p" data-reduce-transparency="true"><code>Reduzir transparência</code>
<div class="palco liso"><span class="mb-glass mb-glass--capsula cap"><i></i>Ambiente: 3 de 4 →</span><div class="mb-tb-group mb-tb-group--tinted"><span class="mb-tb-item mb-tb-item--tinted">▶︎ Rodar</span></div></div>
<div class="palco liso"><div class="mb-glass mb-glass--flutuante painel">⌘ Buscar ação…</div></div>
<code>midia — sólido</code>
<div class="palco ceu"><div class="mb-glass--midia trilho"><b></b></div></div></div>
</div></body></html>
