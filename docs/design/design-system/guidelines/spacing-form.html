<!-- @dsCard group="Spacing" viewport="700x210" name="Formulário centrado" subtitle="Rótulos à direita com dois-pontos, controles 6 pt depois" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Formulário centrado</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.p{padding:16px;background:var(--bg-content);color:var(--label-primary)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:14px}.sw i{display:block;height:44px;border-radius:8px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}.sw b{font-weight:600}.sw code,code{font-family:var(--font-mono);font-size:10px;color:var(--label-secondary)}.two{display:grid;grid-template-columns:1fr 1fr}</style></head><body class="mb-root"><div class="p" style="display:grid;grid-template-columns:1fr 1fr;padding:20px"><div style="display:grid;grid-template-columns:1fr 1.2fr;gap:6px 6px;align-items:center"><div style="text-align:right">Aparência:</div><div><span class="mb-popup" style="width:150px"><span style="flex:1">Sistema</span>⌃</span></div><div style="text-align:right">Seletor padrão:</div><div><span class="mb-popup" style="width:150px"><span style="flex:1">Auto</span>⌃</span></div><div style="text-align:right;align-self:start;padding-top:1px">Proxy:</div><div><span class="mb-check"><span class="mb-check__box" aria-checked="true">✓</span><span>Redigir credenciais<span class="mb-check__help">Oculta Authorization e cookies no HAR.</span></span></span></div><div style="text-align:right">Host:</div><div><input class="mb-field" value="127.0.0.1" style="width:150px;font-family:var(--font-mono)"></div></div><div style="border-left:1px dashed var(--accent);margin-left:-50%;opacity:.0"></div></div></body></html>
