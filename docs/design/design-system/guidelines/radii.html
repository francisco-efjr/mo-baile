<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Raios concêntricos</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.p{padding:16px;background:var(--bg-content);color:var(--label-primary)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:14px}.sw i{display:block;height:44px;border-radius:8px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}.sw b{font-weight:600}.sw code,code{font-family:var(--font-mono);font-size:10px;color:var(--label-secondary)}.two{display:grid;grid-template-columns:1fr 1fr}</style></head><body class="mb-root"><div class="p" style="display:flex;gap:28px;align-items:center"><div style="width:200px;height:120px;border-radius:16px;background:var(--bg-window);box-shadow:inset 0 0 0 1px var(--separator-strong);padding:8px"><div style="height:100%;border-radius:8px;background:var(--accent);opacity:.85;color:#fff;font-size:11px;display:grid;place-items:center">janela 16 − 8 = 8</div></div><div style="width:120px;height:120px;border-radius:10px;background:var(--bg-window);box-shadow:inset 0 0 0 1px var(--separator-strong);padding:4px"><div style="height:22px;border-radius:6px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center">menu 10 − 4 = 6</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:8px;align-items:center"><div style="width:70px;height:24px;border-radius:999px;background:var(--fill-primary)"></div><code>capsule 999</code></div><div style="display:flex;gap:8px;align-items:center"><div style="width:70px;height:22px;border-radius:7px;background:var(--fill-primary)"></div><code>field 7</code></div><div style="display:flex;gap:8px;align-items:center"><div style="width:70px;height:15px;border-radius:4px;background:var(--fill-primary)"></div><code>chip 4</code></div></div></div></body></html>
