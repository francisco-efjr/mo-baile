<!-- @dsCard group="Colors" viewport="700x130" name="Semânticas" subtitle="Destrutiva, sucesso, alerta, info, gravação" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Semânticas</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.p{padding:16px;background:var(--bg-content);color:var(--label-primary)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:14px}.sw i{display:block;height:44px;border-radius:8px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}.sw b{font-weight:600}.sw code,code{font-family:var(--font-mono);font-size:10px;color:var(--label-secondary)}.two{display:grid;grid-template-columns:1fr 1fr}</style></head><body class="mb-root"><div class="two"><div class="p"><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><i style="background:var(--destructive)"></i><b>destrutiva</b><code>--destructive</code></div><div class="sw"><i style="background:var(--success)"></i><b>sucesso</b><code>--success</code></div><div class="sw"><i style="background:var(--warning)"></i><b>alerta</b><code>--warning</code></div><div class="sw"><i style="background:var(--info)"></i><b>info</b><code>--info</code></div><div class="sw"><i style="background:var(--recording)"></i><b>gravando</b><code>--recording</code></div></div></div><div class="p" data-theme="dark"><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><i style="background:var(--destructive)"></i><b>destrutiva</b><code>--destructive</code></div><div class="sw"><i style="background:var(--success)"></i><b>sucesso</b><code>--success</code></div><div class="sw"><i style="background:var(--warning)"></i><b>alerta</b><code>--warning</code></div><div class="sw"><i style="background:var(--info)"></i><b>info</b><code>--info</code></div><div class="sw"><i style="background:var(--recording)"></i><b>gravando</b><code>--recording</code></div></div></div></div></body></html>
