<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Destaque e seleção</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.p{padding:16px;background:var(--bg-content);color:var(--label-primary)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:14px}.sw i{display:block;height:44px;border-radius:8px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}.sw b{font-weight:600}.sw code,code{font-family:var(--font-mono);font-size:10px;color:var(--label-secondary)}.two{display:grid;grid-template-columns:1fr 1fr}</style></head><body class="mb-root"><div class="two"><div class="p"><div class="g" style="grid-template-columns:repeat(4,1fr)"><div class="sw"><i style="background:var(--accent)"></i><b>accent</b><code>--accent</code></div><div class="sw"><i style="background:var(--accent-text)"></i><b>accent-text</b><code>--accent-text</code></div><div class="sw"><i style="background:var(--selection-inactive)"></i><b>seleção inativa</b><code>--selection-inactive</code></div><div class="sw"><i style="background:var(--accent-tint)"></i><b>tinta de vidro</b><code>--accent-tint</code></div></div></div><div class="p" data-theme="dark"><div class="g" style="grid-template-columns:repeat(4,1fr)"><div class="sw"><i style="background:var(--accent)"></i><b>accent</b><code>--accent</code></div><div class="sw"><i style="background:var(--accent-text)"></i><b>accent-text</b><code>--accent-text</code></div><div class="sw"><i style="background:var(--selection-inactive)"></i><b>seleção inativa</b><code>--selection-inactive</code></div><div class="sw"><i style="background:var(--accent-tint)"></i><b>tinta de vidro</b><code>--accent-tint</code></div></div></div></div></body></html>
