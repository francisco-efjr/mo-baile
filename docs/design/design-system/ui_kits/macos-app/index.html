<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo baile — protótipo macOS</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0;height:100%}body{overflow-x:hidden}
body{background:linear-gradient(180deg,#BFE6F5 0%,#9BDCF3 55%,#86CDE8 100%);overflow:auto;font-family:var(--font-ui)}
[data-theme="dark"] body{background:linear-gradient(180deg,#14202E 0%,#1B2A3A 60%,#16222F 100%)}
@keyframes mb-ripple{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.mb-step-new{animation:mb-step-in var(--spring-smooth-duration) var(--spring-smooth-ease) both}
@keyframes mb-step-in{from{max-height:0;opacity:0}to{max-height:40px;opacity:1}}
[data-reduce-motion="true"] .mb-step-new{animation:mb-fade 150ms linear both}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script src="spring.js"></script>
</head>
<body class="mb-root">
<div id="root"></div>
<div data-mb-portal class="mb-root"></div>
<script type="text/babel" src="Mirror.jsx"></script>
<script type="text/babel" src="Inspector.jsx"></script>
<script type="text/babel" src="PageObjects.jsx"></script>
<script type="text/babel" src="Traffic.jsx"></script>
<script type="text/babel" src="Sheets.jsx"></script>
<script type="text/babel" src="NoDevice.jsx"></script>
<script type="text/babel" src="Settings.jsx"></script>
<script type="text/babel" src="AppSidebar.jsx"></script>
<script type="text/babel" src="Demo.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
<script type="text/babel">ReactDOM.createRoot(document.getElementById("root")).render(<App />);</script>
</body>
</html>
