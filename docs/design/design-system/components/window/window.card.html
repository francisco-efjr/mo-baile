<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Janela</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:#fff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lab{font-size:10px;color:var(--label-tertiary);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}</style></head>
<body><div id="r" data-mb-portal></div><script type="text/babel">
const NS = window.MoBaileDesignSystem_ce6669;
function Pane({dark, children, style}){return <div className="mb-root" data-theme={dark?"dark":undefined} style={{background:"var(--bg-content)",color:"var(--label-primary)",padding:16,display:"flex",flexDirection:"column",gap:14,...style}}>{children}</div>;}

const {Window,TrafficLights,Toolbar,ToolbarTitle,ToolbarSpacer,ToolbarButton,ToolbarGroup,DeviceFrame,MenuBar}=NS;
function Win({active}){return <Window active={active} width={300} height={190} style={{minWidth:0,minHeight:0}}><div style={{display:"flex",flex:1}}><div className="mb-sidebar" style={{width:96}}><div style={{height:52,display:"flex",alignItems:"center"}}><TrafficLights/></div><div style={{padding:"0 6px"}}><div className="mb-sb-item is-selected" style={{height:24,fontSize:12}}>Rede HTTP</div><div className="mb-sb-item" style={{height:24,fontSize:12}}>Analytics</div></div></div><div style={{flex:1,background:"var(--bg-content)"}}><Toolbar><ToolbarTitle title="Rede HTTP" subtitle="8 requisições"/></Toolbar></div></div></Window>;}
function App(){return <div className="mb-root" data-mb-portal style={{height:400,background:"linear-gradient(180deg,var(--brand-pool-2),var(--brand-pool))",position:"relative"}}>
<MenuBar menus={[{title:"Mo baile",items:[]},{title:"Arquivo",items:[]},{title:"Editar",items:[]},{title:"Visualizar",items:[]},{title:"Dispositivo",items:[]},{title:"Janela",items:[]},{title:"Ajuda",items:[]}]} right={<span>qui 8 out 15:31</span>}/>
<div style={{display:"flex",gap:24,padding:"28px 24px",alignItems:"flex-start"}}><div style={{display:"flex",flexDirection:"column",gap:8}}><Win active/><Win active={false}/></div>
<DeviceFrame width={150} height={314}><div style={{position:"absolute",inset:0,background:"#fff"}}/></DeviceFrame>
<div data-theme="dark" className="mb-root" style={{background:"transparent"}}><DeviceFrame width={110} height={230}/></div></div></div>;}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
