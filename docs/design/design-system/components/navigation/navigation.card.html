<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Navegação</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:#fff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lab{font-size:10px;color:var(--label-tertiary);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}</style></head>
<body><div id="r" data-mb-portal></div><script type="text/babel">
const NS = window.MoBaileDesignSystem_ce6669;
function Pane({dark, children, style}){return <div className="mb-root" data-theme={dark?"dark":undefined} style={{background:"var(--bg-content)",color:"var(--label-primary)",padding:16,display:"flex",flexDirection:"column",gap:14,...style}}>{children}</div>;}

const {Sidebar,SidebarSection,SidebarItem,SidebarBottomBar,Toolbar,ToolbarTitle,ToolbarSpacer,ToolbarButton,ToolbarGroup,ToolbarSearch,AccessoryBar,SegmentedControl,TrafficLights,StatusIndicator,Icon}=NS;
function App(){const [sel,setSel]=React.useState("po");const [q,setQ]=React.useState("");const [s,setS]=React.useState("Auto");
return <div className="mb-root" style={{display:"flex",height:420,background:"var(--bg-window)"}}>
<Sidebar width={232} header={<><TrafficLights/><span style={{flex:1}}/><ToolbarButton icon="panel-left" label="Ocultar Barra Lateral"/></>}
 bottomBar={<SidebarBottomBar actions={[{icon:"refresh-cw",label:"Atualizar lista"}]} status={<StatusIndicator status="busy" label="procurando…" mono={false}/>}/>}>
<SidebarSection title="Aparelhos"><SidebarItem icon="smartphone" iconColor="var(--platform-ios)" label="iPhone 16" sublabel="iOS 18.6" selected={sel==="d"} onSelect={()=>setSel("d")}/><SidebarItem icon="smartphone" iconColor="var(--platform-android)" label="Pixel 7 — emulator-5554" onSelect={()=>setSel("p")} selected={sel==="p"}/></SidebarSection>
<SidebarSection title="Sessão"><SidebarItem icon="file-code" iconColor="var(--cat-1)" label="Page Objects" count={6} selected={sel==="po"} onSelect={()=>setSel("po")}/><SidebarItem icon="network" iconColor="var(--cat-3)" label="Rede HTTP" count={8} selected={sel==="n"} onSelect={()=>setSel("n")}/><SidebarItem icon="chart-line" iconColor="var(--cat-2)" label="Analytics" count={6} selected={sel==="a"} onSelect={()=>setSel("a")}/></SidebarSection>
</Sidebar>
<div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0,background:"var(--bg-content)"}}>
<Toolbar><ToolbarTitle title="Page Objects" subtitle="iPhone 16 · 6 passos"/><ToolbarSpacer/><ToolbarGroup><ToolbarButton icon="hand" label="Gravar do Aparelho"/><ToolbarButton icon="video" label="Gravar a Tela"/></ToolbarGroup><ToolbarGroup tinted><ToolbarButton icon="play" label="Rodar Automação" variant="tinted"/></ToolbarGroup><ToolbarSearch value={q} onChange={setQ}/><ToolbarGroup><ToolbarButton icon="panel-right" label="Ocultar Inspector" on/></ToolbarGroup></Toolbar>
<AccessoryBar><SegmentedControl size="small" items={["Auto","ID","XPath","Coords"]} value={s} onChange={setS}/></AccessoryBar>
<div style={{flex:1}}/></div></div>;}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);</script></body></html>
