<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início · maquete</title>
<!-- Maquete da tela Início (4.0.0). Usa só os tokens e as classes do design
     system Liquid Glass; abre direto do disco, sem rede. Três estados no
     seletor do topo: Mac zerado, ambiente parcial e tudo pronto. -->
<link rel="stylesheet" href="../design-system/styles.css">
<style>
  html,body{margin:0;min-height:100%}
  body{background:linear-gradient(180deg,#BFE6F5 0%,#9BDCF3 55%,#86CDE8 100%);font-family:var(--font-ui);padding:24px 16px 40px}
  [data-theme="dark"] body{background:linear-gradient(180deg,#14202E 0%,#1B2A3A 60%,#16222F 100%)}
  .controles{display:flex;gap:12px;justify-content:center;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .janela{max-width:1180px;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--bg-window);box-shadow:var(--shadow-window, 0 22px 70px rgba(10,12,40,.35));display:grid;grid-template-columns:220px 1fr;min-height:860px;color:var(--label-primary);font-size:var(--text-body)}
  .lateral{padding:12px 10px;background:var(--bg-sidebar);border-right:1px solid var(--separator);display:flex;flex-direction:column}
  .semaforo{display:flex;gap:8px;padding:4px 6px 14px}.semaforo i{width:12px;height:12px;border-radius:6px;display:block}
  .item{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;color:var(--label-primary)}
  .item svg{width:16px;height:16px}
  .item.sel{background:var(--fill-primary)}
  .item .n{margin-left:auto;font-size:11px;color:var(--label-secondary);font-variant-numeric:tabular-nums}
  .cab{font-size:var(--text-subheadline);font-weight:600;color:var(--label-secondary);padding:12px 8px 4px}
  .rodape-lat{margin-top:auto;border-top:1px solid var(--separator);padding:8px 6px 0;font-size:11px;color:var(--label-secondary);display:flex;gap:6px;align-items:center}
  .detalhe{background:var(--bg-content);display:flex;flex-direction:column;min-width:0}
  .barra{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--separator)}
  .titulo b{display:block;font-size:13px}.titulo span{font-size:11px;color:var(--label-secondary)}
  .pilula{margin-left:8px;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:var(--fill-secondary);font-size:13px}
  .rolagem{flex:1;overflow:auto;padding:28px 20px 24px}
  .coluna{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .topo{display:flex;align-items:center;gap:14px}
  .topo img{width:56px;height:56px}
  .topo h1{margin:0;font-size:22px;line-height:28px;font-weight:700}
  .topo p{margin:2px 0 0;color:var(--label-secondary)}
  .topo .verif{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--label-secondary);white-space:nowrap}
  h2{margin:0 0 8px;font-size:13px;font-weight:700}
  .cartao{background:var(--bg-group);border-radius:12px;box-shadow:inset 0 0 0 .5px var(--separator);padding:16px}
  .proximo{box-shadow:inset 0 0 0 2px var(--accent)}
  .proximo .rot{font-size:11px;font-weight:600;color:var(--accent-text)}
  .proximo h3{margin:4px 0 4px;font-size:15px}
  .proximo p{margin:0 0 12px;color:var(--label-secondary);max-width:600px}
  .cmd{font-family:var(--font-mono);font-size:11.5px;background:var(--fill-tertiary);border-radius:7px;padding:6px 8px;margin:0 0 12px;color:var(--label-primary);overflow-x:auto;white-space:nowrap}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .areas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .area{display:flex;flex-direction:column;gap:6px;cursor:pointer}
  .area:hover{background:var(--fill-tertiary)}
  .area svg.ic{width:20px;height:20px}
  .area b{font-size:13px}
  .area .desc{font-size:11px;line-height:14px;color:var(--label-secondary);min-height:28px}
  .plat{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--label-secondary)}
  .plat svg{width:12px;height:12px}
  .grupo{padding:0}
  .grupo .linha{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-top:1px solid var(--separator)}
  .grupo .linha:first-child{border-top:0}
  .linha svg.st{width:15px;height:15px;margin-top:1px;flex:none}
  .linha .txt{flex:1;min-width:0}
  .linha .txt div:last-child{font-size:11px;line-height:14px;color:var(--label-secondary)}
  .linha .mono{font-family:var(--font-mono)}
  .tag{font-size:10px;font-weight:600;color:var(--label-secondary);background:var(--fill-secondary);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
  .linha .mb-btn{flex:none}
  .nota{font-size:11px;color:var(--label-secondary);text-align:center}
  .ok{color:var(--success)}.warn{color:var(--warning)}.err{color:var(--destructive)}.off{color:var(--label-tertiary)}
  svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  @media (max-width:820px){.janela{grid-template-columns:1fr}.lateral{display:none}.areas{grid-template-columns:repeat(2,1fr)}.topo{flex-wrap:wrap}.topo .verif{margin-left:0}}
</style>
</head>
<body class="mb-root">
<div class="controles">
  <div class="mb-seg" role="tablist" id="estados">
    <button class="mb-seg__item" data-estado="zerado">Mac zerado</button>
    <button class="mb-seg__item" data-estado="parcial" aria-selected="true">Parcial</button>
    <button class="mb-seg__item" data-estado="pronto">Tudo pronto</button>
  </div>
  <button class="mb-btn mb-btn--small" id="tema">Claro / Escuro</button>
</div>

<div class="janela">
  <aside class="lateral">
    <div class="semaforo"><i style="background:var(--traffic-close)"></i><i style="background:var(--traffic-minimize)"></i><i style="background:var(--traffic-zoom)"></i></div>
    <div class="item sel"><svg viewBox="0 0 24 24" style="color:var(--accent)"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Início<span class="n" id="pend-lat"></span></div>
    <div class="cab">Workspace</div>
    <div class="item"><svg viewBox="0 0 24 24" style="color:var(--cat-1)"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>Page Objects</div>
    <div class="item"><svg viewBox="0 0 24 24" style="color:var(--cat-3)"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>Rede HTTP</div>
    <div class="item"><svg viewBox="0 0 24 24" style="color:var(--cat-2)"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>Analytics</div>
    <div class="item"><svg viewBox="0 0 24 24" style="color:var(--cat-2)"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>Relatório</div>
    <div class="cab">Fluxo · fluxo</div>
    <div style="padding:2px 8px;font-size:12px;color:var(--label-secondary)">Nenhum passo gravado.</div>
    <div class="rodape-lat" id="rod-lat">Sem aparelho</div>
  </aside>

  <main class="detalhe">
    <div class="barra">
      <div class="titulo"><b>Início</b><span id="subtitulo"></span></div>
      <div class="pilula" id="pilula">Nenhum dispositivo</div>
    </div>
    <div class="rolagem"><div class="coluna" id="conteudo"></div></div>
  </main>
</div>

<script>
const IC = {
  ok:'<svg class="st ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',
  warn:'<svg class="st warn" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  error:'<svg class="st err" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>',
  off:'<svg class="st off" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>',
};
const AREAS = [
  ['Page Objects','Espelho, hierarquia e código Appium de cada toque.','var(--cat-1)','<path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/>'],
  ['Rede HTTP','Tráfego do aparelho pelo proxy local, com HTTPS.','var(--cat-3)','<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>'],
  ['Analytics','Eventos do Firebase Analytics em tempo real.','var(--cat-2)','<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/>'],
  ['Relatório','Audita os eventos contra a spec. Funciona sem aparelho.','var(--cat-2)','<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>'],
];
const btn = (t, tipo='') => `<button class="mb-btn mb-btn--small ${tipo}">${t}</button>`;
const linha = (st, rot, det, extra='', tag='') => `<div class="linha">${IC[st]}<div class="txt"><div>${rot}${tag?`<span class="tag">${tag}</span>`:''}</div><div>${det}</div></div>${extra}</div>`;

const ESTADOS = {
  zerado: {
    sub:'Falta instalar 1 item', pilula:'Nenhum dispositivo', lat:'Motor parado', pend:'1',
    titulo:'Boas-vindas ao Mo baile',
    resumo:'Antes de tudo, o motor precisa de um Python. Depois dele, o Mo baile confere o resto sozinho.',
    proximo:{rot:'Próximo passo', h:'Instalar o Python do Mo baile',
      p:'Cria um Python 3.12 só para o Mo baile, com Pillow e requests. Precisa de internet só agora; depois tudo roda offline.',
      cmd:'bash "Mo baile (nativo).app/Contents/Resources/setup/instalar-mac.sh" python',
      acoes: btn('Instalar no Terminal…','mb-btn--default')+btn('Copiar Comando')},
    areas:[['off','iOS','off','Android'],['off','iOS','off','Android'],['off','iOS','off','Android'],['off','sem aparelho','','']],
    areasDet:'depende do motor',
    grupos:[
      ['Motor', linha('error','Python 3.10 ou mais novo','Nenhum Python 3 serve: /usr/bin/python3 é 3.9.6. O motor não sobe sem ele.', btn('Instalar no Terminal…'))],
      ['Android', linha('off','Android Platform Tools (adb)','Verificado depois que o motor subir.')+linha('off','Emulador Android','Verificado depois que o motor subir.')],
      ['iOS', linha('off','Ferramentas do Xcode','Verificado depois que o motor subir.')+linha('off','Appium e driver XCUITest','Verificado depois que o motor subir.')],
    ],
  },
  parcial: {
    sub:'Falta instalar 1 item para iOS', pilula:'Nenhum dispositivo', lat:'Sem aparelho', pend:'1',
    titulo:'Boas-vindas ao Mo baile',
    resumo:'Android está pronto. Para iOS, falta o Appium com o driver XCUITest.',
    proximo:{rot:'Próximo passo', h:'Instalar o Appium e o driver XCUITest',
      p:'Sem eles, o espelho do simulador funciona, mas toque, hierarquia e Page Objects no iOS ficam desligados. Precisa de internet só agora.',
      cmd:'npm install -g appium && appium driver install xcuitest',
      acoes: btn('Instalar no Terminal…','mb-btn--default')+btn('Copiar Comando')},
    areas:[['warn','iOS só espelho','ok','Android'],['ok','iOS','ok','Android'],['ok','iOS','ok','Android'],['ok','sem aparelho','','']],
    grupos:[
      ['Motor', linha('ok','Python 3.14.0','<span class="mono">/usr/local/bin/python3</span> · Pillow 11.3 · requests 2.32')],
      ['Android', linha('ok','Android Platform Tools (adb)','<span class="mono">/opt/homebrew/bin/adb</span> · 36.0.0')
        +linha('warn','Emulador Android','2 emuladores parados.', btn('Abrir Emulador'))
        +linha('ok','scrcpy','Espelho a 60 quadros por segundo.', '', 'Opcional')],
      ['iOS', linha('ok','Ferramentas do Xcode','xcrun e simctl · 3 simuladores')
        +linha('error','Appium e driver XCUITest','Appium não encontrado. Toque, hierarquia e Page Objects no iOS dependem dele.', btn('Instalar no Terminal…'))
        +linha('ok','Node.js','<span class="mono">/opt/homebrew/bin/node</span> · v22.11')
        +linha('off','pymobiledevice3','Só para Analytics de iPhone físico por cabo.', btn('Instalar no Terminal…'), 'Opcional')],
      ['Extras opcionais', linha('ok','Escuta passiva de toques','pyobjc-framework-Quartz instalado.','', 'Opcional')],
    ],
  },
  pronto: {
    sub:'Tudo pronto', pilula:'iPhone 16 Pro', lat:'iPhone 16 Pro conectado', pend:'',
    titulo:'Mo baile',
    resumo:'Tudo pronto para iOS e Android.',
    proximo:{rot:'Aparelho conectado', h:'iPhone 16 Pro · iOS 18.6',
      p:'O espelho começa sozinho ao abrir uma área. O toque no espelho vira toque no aparelho.',
      cmd:'', acoes: btn('Abrir Page Objects','mb-btn--default')+btn('Abrir Rede HTTP')},
    areas:[['ok','iOS','ok','Android'],['ok','iOS','ok','Android'],['ok','iOS','ok','Android'],['ok','sem aparelho','','']],
    grupos:[
      ['Motor', linha('ok','Python 3.14.0','<span class="mono">/usr/local/bin/python3</span> · Pillow 11.3 · requests 2.32')],
      ['Android', linha('ok','Android Platform Tools (adb)','<span class="mono">/opt/homebrew/bin/adb</span> · 36.0.0')+linha('ok','Emulador Android','2 emuladores')+linha('ok','scrcpy','Espelho a 60 quadros por segundo.','', 'Opcional')],
      ['iOS', linha('ok','Ferramentas do Xcode','xcrun e simctl · 3 simuladores')+linha('ok','Appium e driver XCUITest','Appium 2.11 · xcuitest 7.24')+linha('ok','WebDriverAgent','http://localhost:8100')],
      ['Extras opcionais', linha('ok','pymobiledevice3','Analytics e Rede de iPhone físico por cabo.','', 'Opcional')],
    ],
  },
};

function render(nome){
  const e = ESTADOS[nome];
  document.querySelectorAll('#estados button').forEach(b=>b.setAttribute('aria-selected', b.dataset.estado===nome));
  document.getElementById('subtitulo').textContent = e.sub;
  document.getElementById('pilula').textContent = e.pilula;
  document.getElementById('rod-lat').textContent = e.lat;
  document.getElementById('pend-lat').textContent = e.pend;
  const areas = AREAS.map(([n,d,cor,path],i)=>{
    const [s1,r1,s2,r2] = e.areas[i];
    const det = e.areasDet ? `<div class="plat">${IC.off}${e.areasDet}</div>` :
      `<div class="plat">${IC[s1]}${r1}</div>${s2?`<div class="plat">${IC[s2]}${r2}</div>`:''}`;
    return `<div class="cartao area"><svg class="ic" viewBox="0 0 24 24" style="color:${cor}">${path}</svg><b>${n}</b><div class="desc">${d}</div>${det}</div>`;
  }).join('');
  const p = e.proximo;
  document.getElementById('conteudo').innerHTML = `
    <div class="topo">
      <img src="../design-system/assets/app-icon.png" alt="">
      <div><h1>${e.titulo}</h1><p>${e.resumo}</p></div>
      <div class="verif"><span class="mb-mono mb-tabular">verificado às 10:54</span><button class="mb-btn mb-btn--plain mb-btn--small">Verificar de Novo</button></div>
    </div>
    <section><div class="cartao proximo">
      <div class="rot">${p.rot}</div><h3>${p.h}</h3><p>${p.p}</p>
      ${p.cmd?`<div class="cmd">${p.cmd}</div>`:''}
      <div class="acoes">${p.acoes}</div>
    </div></section>
    <section><h2>Áreas</h2><div class="areas">${areas}</div></section>
    <section><h2>Ambiente</h2><div style="display:flex;flex-direction:column;gap:12px">
      ${e.grupos.map(([t,l])=>`<div><div class="cab" style="padding:0 2px 6px">${t}</div><div class="cartao grupo">${l}</div></div>`).join('')}
    </div></section>
    <p class="nota">Depois de instalado, tudo roda nesta máquina, sem internet.</p>`;
}
document.querySelectorAll('#estados button').forEach(b=>b.onclick=()=>render(b.dataset.estado));
document.getElementById('tema').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
render('parcial');
</script>
</body>
</html>
